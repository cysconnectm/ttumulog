/* ---------- preview store (only when opened outside claude.ai) ---------- */
function previewDb() {
  const cols = { projects: new Map(), entries: new Map(), posts: new Map() }, subs = { projects: [], entries: [], posts: [] };
  const snap = n => ({ docs: [...cols[n]].map(([id, d]) => ({ id, exists: true, data: () => d })), metadata: { fromCache: false, hasPendingWrites: false } });
  const emit = n => subs[n].forEach(f => f(snap(n)));
  const t = today(), ago = k => { const d = new Date(); d.setDate(d.getDate() - k); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
  cols.projects.set('demo1', { title: '예시 · 탑다운 래글런 스웨터', status: 'knitting', pattern: '기본 래글런 (예시)', yarn: '메리노 DK · 오트밀', needles: '4.0mm / 3.5mm 줄바늘', gauge: '10cm = 22코 30단', rows: 46, totalRows: 120, startedAt: ago(20), notes: '몸판 5cm 늘림.', createdAt: 1, updatedAt: 3 });
  cols.projects.set('demo2', { title: '예시 · 줄무늬 목도리', status: 'done', yarn: '알파카 울 · 네이비/크림', needles: '5.0mm', rows: 260, totalRows: 260, startedAt: ago(70), finishedAt: ago(40), createdAt: 0, updatedAt: 1 });
  cols.posts.set('post1', { title: '예시 · 첫 스웨터 일지', projectId: 'demo1', cover: null, createdAt: 2, updatedAt: 3 });
  cols.posts.set('post2', { title: '예시 · 겨울 목도리', projectId: 'demo2', cover: null, createdAt: 1, updatedAt: 1 });
  cols.entries.set('demoe1', { postId: 'post1', projectId: 'demo1', date: t, title: '몸판 분리 완료', text: '소매 코를 쉼코로 옮기고 몸판만 이어서 뜨기 시작.\n겨드랑이 코잡기 8코.', rowsAt: 46, hours: 1.5, photos: [], createdAt: 3 });
  cols.entries.set('demoe2', { postId: 'post1', projectId: 'demo1', date: ago(6), text: '요크 늘림 마지막 단. 코 수 세다가 두 번 틀려서 다시 셌다.', rowsAt: 30, photos: [], createdAt: 2 });
  cols.entries.set('demoe3', { postId: 'post2', projectId: 'demo2', date: ago(40), title: '목도리 완성!', text: '술 달고 스팀 블로킹까지 끝.', photos: [], createdAt: 1 });
  return {
    collection: n => ({ onSnapshot(f) { subs[n].push(f); setTimeout(() => f(snap(n)), 300); return () => {}; } }),
    doc: path => { const [n, id] = path.split('/'); return {
      set: async d => { cols[n].set(id, { ...d }); emit(n); },
      update: async d => { if (!cols[n].has(id)) throw { code: 'invalid_argument' }; cols[n].set(id, { ...cols[n].get(id), ...d }); emit(n); },
      delete: async () => { cols[n].delete(id); emit(n); } }; }
  };
}

/* ---------- on-device store (standalone app: everything stays on this device) ---------- */
const IDB_NAME = 'hankoh', DOC_STORES = ['projects', 'entries', 'posts'];
const idbReq = rq => new Promise((res, rej) => { rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error); });
const idbErr = e => (e && e.name === 'QuotaExceededError') ? { code: 'quota_exceeded' } : (e || {});
const idbDone = tx => new Promise((res, rej) => { tx.oncomplete = () => res(); tx.onerror = tx.onabort = () => rej(idbErr(tx.error)); });
function idbOpen() {
  return new Promise((res, rej) => {
    const rq = indexedDB.open(IDB_NAME, 1);
    rq.onupgradeneeded = () => { for (const n of [...DOC_STORES, 'assets']) if (!rq.result.objectStoreNames.contains(n)) rq.result.createObjectStore(n); };
    rq.onsuccess = () => res(rq.result);
    rq.onerror = () => rej(rq.error);
  });
}
async function idbAll(idb, n) {
  const st = idb.transaction(n).objectStore(n);
  const [keys, vals] = await Promise.all([idbReq(st.getAllKeys()), idbReq(st.getAll())]);
  return keys.map((k, i) => [k, vals[i]]);
}
function localDb(idb) {
  const subs = { projects: [], entries: [], posts: [] };
  const snap = rows => ({ docs: rows.map(([id, d]) => ({ id, exists: true, data: () => d })), metadata: { fromCache: false, hasPendingWrites: false } });
  const emit = async n => { const s = snap(await idbAll(idb, n)); subs[n].forEach(f => f(s)); };
  const write = async (n, fn) => { const tx = idb.transaction(n, 'readwrite'); fn(tx.objectStore(n)); await idbDone(tx); await emit(n); };
  return {
    emit,
    collection: n => ({ onSnapshot(f, onErr) { subs[n].push(f); idbAll(idb, n).then(rows => f(snap(rows)), onErr); return () => {}; } }),
    doc: path => { const [n, id] = path.split('/'); return {
      set: d => write(n, st => st.put({ ...d }, id)),
      update: async d => {
        const cur = await idbReq(idb.transaction(n).objectStore(n).get(id));
        if (!cur) throw { code: 'not_found' };
        await write(n, st => st.put({ ...cur, ...d }, id));
      },
      delete: () => write(n, st => st.delete(id)) }; }
  };
}
const hexId = () => [...crypto.getRandomValues(new Uint8Array(16))].map(b => b.toString(16).padStart(2, '0')).join('');
function localAssets(idb) {
  return {
    async upload(b, opts) {
      const type = (opts && opts.type) || b.type || 'application/octet-stream';
      const file = b.type === type ? b : new Blob([b], { type });
      const id = hexId();
      const tx = idb.transaction('assets', 'readwrite');
      tx.objectStore('assets').put({ blob: file, type, size: file.size, createdAt: Date.now() }, id);
      await idbDone(tx);
      S.urls.set(id, URL.createObjectURL(file));
      return { id, url: S.urls.get(id), sizeBytes: file.size, contentType: type };
    },
    async delete(id) {
      const tx = idb.transaction('assets', 'readwrite');
      tx.objectStore('assets').delete(id);
      await idbDone(tx);
      const u = S.urls.get(id); if (u) { URL.revokeObjectURL(u); S.urls.delete(id); }
    }
  };
}
async function loadAssetUrls() {
  for (const u of S.urls.values()) URL.revokeObjectURL(u);
  S.urls.clear();
  for (const [id, a] of await idbAll(S.idb, 'assets')) if (a && a.blob) S.urls.set(id, URL.createObjectURL(a.blob));
}

/* ---------- backup: one file = header JSON + every photo/PDF appended as raw bytes ---------- */
const BK_MAGIC = 'HANKOH01';
async function buildBackup() {
  const head = { app: 'hankoh', version: 1, exportedAt: new Date().toISOString(), data: {}, assets: [] };
  for (const n of DOC_STORES) head.data[n] = Object.fromEntries(await idbAll(S.idb, n));
  const parts = [];
  let offset = 0;
  for (const [id, a] of await idbAll(S.idb, 'assets')) {
    if (!a || !a.blob) continue;
    head.assets.push({ id, type: a.type || a.blob.type, size: a.blob.size, offset, createdAt: a.createdAt || 0 });
    parts.push(a.blob); offset += a.blob.size;
  }
  const json = new TextEncoder().encode(JSON.stringify(head));
  const len = new Uint8Array(4); new DataView(len.buffer).setUint32(0, json.length);
  return new Blob([new TextEncoder().encode(BK_MAGIC), len, json, ...parts], { type: 'application/octet-stream' });
}
async function saveBackup() {
  const d = new Date();
  const name = `뜨무로그-백업-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}.knitbackup`;
  const file = new File([await buildBackup()], name, { type: 'application/octet-stream' });
  // phones: the share sheet offers "파일에 저장"; computers: a normal download
  if (matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return true; }
    catch (e) { if (e && e.name === 'AbortError') return false; }
  }
  const a = h('a', { href: URL.createObjectURL(file), download: name });
  document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
  return true;
}
async function restoreBackup(file) {
  const pre = new Uint8Array(await file.slice(0, 12).arrayBuffer());
  if (pre.length < 12 || new TextDecoder().decode(pre.slice(0, 8)) !== BK_MAGIC) throw { code: 'bad_backup' };
  const len = new DataView(pre.buffer).getUint32(8);
  let head;
  try { head = JSON.parse(await file.slice(12, 12 + len).text()); } catch { throw { code: 'bad_backup' }; }
  if (!head || head.app !== 'hankoh' || !head.data) throw { code: 'bad_backup' };
  const base = 12 + len;
  for (const a of head.assets || []) if (base + a.offset + a.size > file.size) throw { code: 'bad_backup' };
  // replace everything on this device with the backup
  const tx = S.idb.transaction([...DOC_STORES, 'assets'], 'readwrite');
  for (const n of [...DOC_STORES, 'assets']) tx.objectStore(n).clear();
  for (const n of DOC_STORES) for (const [id, d] of Object.entries(head.data[n] || {})) tx.objectStore(n).put(d, id);
  await idbDone(tx);
  for (const a of head.assets || []) {
    const buf = await file.slice(base + a.offset, base + a.offset + a.size).arrayBuffer();
    const t2 = S.idb.transaction('assets', 'readwrite');
    t2.objectStore('assets').put({ blob: new Blob([buf], { type: a.type }), type: a.type, size: a.size, createdAt: a.createdAt || Date.now() }, a.id);
    await idbDone(t2);
  }
  await loadAssetUrls();
  for (const n of DOC_STORES) await S.db.emit(n);
}
function openBackup() {
  const err = h('div', { class: 'err', role: 'alert' });
  const fileId = 'bk-' + newId();
  const inp = h('input', { type: 'file', id: fileId, style: 'position:absolute;width:1px;height:1px;opacity:0;pointer-events:none', onchange: e => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    confirmBox(`'${f.name}' 백업으로 지금 기록을 모두 바꿔요. 지금 이 기기에 있는 기록은 사라져요.`, '불러오기', async () => {
      await restoreBackup(f); location.hash = 'feed'; toast('백업을 불러왔어요');
    }, '백업을 불러올까요?');
  } });
  const save = h('button', { class: 'btn primary', type: 'button', onclick: async () => {
    err.textContent = ''; save.disabled = true; save.textContent = '만드는 중…';
    try { if (await saveBackup()) toast('백업 파일을 만들었어요'); }
    catch (e) { err.textContent = '백업 파일을 만들지 못했어요.'; }
    save.disabled = false; save.textContent = '백업 파일 저장';
  } }, '백업 파일 저장');
  openSheet('백업', h('div', { class: 'form' },
    h('p', { style: 'margin:0', text: '기록과 사진, 도안은 이 기기에만 저장돼요. 기기를 바꾸거나 앱을 지우기 전에 백업 파일을 저장해 두세요.' }),
    err,
    h('div', { class: 'form-foot' }, h('label', { class: 'btn', for: fileId }, '백업 불러오기'), inp, save)));
}
$('#backup-btn').addEventListener('click', openBackup);

/* ---------- boot ---------- */
function subscribe() {
  const timer = setTimeout(() => { if (!allLoaded()) { S.slow = true; render(); } }, 10000);
  const done = () => { if (allLoaded()) { clearTimeout(timer); S.slow = false; } };
  S.db.collection('projects').onSnapshot(snap => {
    S.projects = new Map(snap.docs.map(d => [d.id, { id: d.id, ...d.data() }]));
    S.got.projects = true; done(); render();
  }, () => { S.got.projects = true; done(); S.slow = true; render(); });
  S.db.collection('entries').onSnapshot(snap => {
    S.entries = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    S.got.entries = true; done(); render();
  }, () => { S.got.entries = true; done(); S.slow = true; render(); });
  S.db.collection('posts').onSnapshot(snap => {
    S.posts = new Map(snap.docs.map(d => [d.id, d.data()]));
    S.got.posts = true; done(); render();
  }, () => { S.got.posts = true; done(); S.slow = true; render(); });
}

render();
(async () => {
  const c = window.claude;
  if (!c || typeof c.use !== 'function') {
    // standalone app: keep everything in this device's browser storage
    try {
      S.idb = await idbOpen(); S.urls = new Map();
      await loadAssetUrls();
      S.db = localDb(S.idb); S.assets = localAssets(S.idb); S.mode = 'local';
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
      $('#backup-btn').hidden = false;
    } catch {
      S.idb = null; S.urls = null; S.mode = 'preview'; S.db = previewDb();
    }
    subscribe(); render(); return;
  }
  const [db, user] = await Promise.all([c.use('db'), c.use('user')]);
  if (!db) { S.mode = 'nodb'; render(); return; }
  if (user && (await user.isOwner()) === false) { S.mode = 'notowner'; render(); return; }
  S.db = db; S.mode = 'live';
  S.assets = await c.use('assets');
  subscribe(); render();
})();
})();
</script>

<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>
